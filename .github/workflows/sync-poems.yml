name: Sync writing from Markdown

on:
  push:
    branches: [main]
    paths:
      - 'poems/*.md'
      - 'stories/*.md'
      - 'tools/sync_poems.py'
      - 'assets/poem-live.js'
      - 'assets/story-theme.js'
      - 'assets/marco-experiments.js'
      - 'assets/marco-experiments.css'
      - '.github/workflows/sync-poems.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: poetry-source-sync
  cancel-in-progress: false

jobs:
  publish-poems:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Regenerate reading pages and animation text
        run: python3 tools/sync_poems.py
      - name: Check generated writing
        run: |
          python3 tools/sync_poems.py --check
          git diff --check
          node --check assets/poem-live.js
          node --check assets/story-theme.js
          node --check assets/marco-experiments.js
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stories/the-unlikely-death-of-marco-fragale.html
          git add versions/marco-fading-light.html versions/marco-rising-darkness.html
          git add poems/among-sequoia-sempervirens.html poems/boston-proper.html poems/olympic.html
          git add versions/sequoia-upward-crawl-v1.html versions/sequoia-upward-crawl-dusk.html
          git add versions/sequoia-upward-crawl-bark.html versions/sequoia-upward-crawl-signature.html
          if ! git diff --cached --quiet; then
            git commit -m "Sync published writing from Markdown [skip ci]"
            git push
          fi
